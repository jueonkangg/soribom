# 소리봄 설정
#
# 모든 설정값은 여기에 둔다. 코드에 숫자를 직접 박지 말 것.
# 값을 바꿀 때는 왜 바꿨는지 주석으로 남긴다.
#
# 마지막 실측: 2026-07-25 (Jetson Orin Nano + ReSpeaker v3.0)

audio:
  # sounddevice(구현 capture.py)는 장치 '이름'으로 부분일치시켜 찾는다.
  # 그래서 arecord의 "hw:2,0"이 아니라 이름 조각 "ReSpeaker"를 쓴다.
  # (arecord의 카드번호와 sounddevice 인덱스는 서로 달라 "hw:2,0"이면 엉뚱한 장치를 잡는다)
  device: "ReSpeaker"      # 부분 문자열로 매칭

  # ReSpeaker 는 6채널로 나온다 (--dump-hw-params 로 확인)
  #   0    = 칩이 처리한 소리 (빔포밍·에코제거·잡음억제 완료)
  #   1~4  = 마이크 4개의 원본
  #   5    = 재생 참조음 (에코제거용)
  channels: 6

  # 음성인식에는 0번만 쓴다. 칩이 이미 깨끗하게 만들어놨다.
  # 원본 1~4 는 나중에 실험할 때 쓴다.
  use_channel: 0

  # ReSpeaker 가 고정으로 내보내는 값이고,
  # Whisper 가 요구하는 값과 같아서 변환이 필요 없다.
  sample_rate: 16000

  block_ms: 30

vad:
  # 말하는 구간만 골라낸다. 조용한 구간까지 인식하면
  # 연산이 낭비되고 엉뚱한 글자가 나온다.
  model: "silero"
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 400
  speech_pad_ms: 200       # 발화 앞에 붙일 여유 (첫 음절 잘림 방지)

stt:
  # small 단일 패스로 확정. 원래 2-패스(small→medium) 설계였으나 실측으로 폐기:
  #  (1) medium은 8GB 공유메모리에 앱과 함께 올리면 OOM(예산 총 150만원 제약),
  #  (2) 정확도도 small과 사실상 동일(둘 다 CER ~1%, 잡음에도 강함 — ReSpeaker ch0 빔포밍),
  #  (3) 문맥 기반 2-패스 교정도 정확도를 못 올림.
  # GPU에서 발화당 ~0.5초, 메모리 여유.
  model: "small"
  language: "ko"

  # 교실 용어를 미리 알려주면 인식이 올바른 후보로 정렬돼 오인식이 준다(생성이 아니라 인식 편향).
  # "광합성"을 small은 "과막성/광업성"으로 잘못 듣던 것이, 용어를 주니 정확히 인식됨.
  # 용어는 코드에 박지 않고 과목별 사전 파일(src/vocab/)에 둔다:
  #   hotwords = common.txt(공통) + <subject>.txt(과목) + 학생 이름(events.student_names).
  #   initial_prompt 가 아니라 hotwords 로 쓴다(불분명할 때 용어를 그대로 뱉는 에코 방지).
  # 아래 subject 로 시작 과목을 정하고, 실행 중에는 UI 헤더 드롭다운으로 바꾼다.
  subject: "science"       # korean | math | science | english | economics

  # CTranslate2를 CUDA로 소스빌드(v4.5.0)해 GPU로 돌린다(2026-07-21 cuDNN 확인 완료).
  # 순수 int8이 이 공유메모리에 맞는다. (CUDA CT2가 없는 환경이면 device: cpu / compute_type int8)
  compute_type: "int8"
  device: "cuda"
  beam_size: 1             # 1 = 가장 빠름. 정확도가 더 필요하면 올리되 느려진다
  cpu_threads: 0           # 0 = 자동 (device: cpu 로 폴백할 때만 의미 있음)

doa:
  enabled: true

  # 방향을 계산하는 건 ReSpeaker 의 XMOS 칩이다.
  # Jetson 은 USB 로 각도 값만 읽는다.
  # 출처: https://github.com/respeaker/usb_4_mic_array (Apache-2.0)
  vendor_id: 0x2886
  product_id: 0x0018

  # 실측 (2026-07-19) — 자세한 내용은 docs/13-doa-calibration.md
  #   앞 90° · 왼쪽 172° · 뒤 272° · 오른쪽 346°
  #   각도는 오른쪽이 0°, 반시계 방향으로 증가한다.
  #
  # 화면에는 앞이 0°, 시계 방향이 자연스럽다:
  #   screen_angle = (front_offset - mic_angle) % 360
  front_offset: 90

  # 목소리가 감지될 때만 각도를 갱신한다.
  #    조용할 때 값은 직전 방향이 남아 있는 것이라 믿을 수 없다.
  #    이걸 끄면 화살표가 제멋대로 돈다.
  require_voice: true

  # 화살표가 덜덜 떨리지 않게 부드럽게 만든다 (지수이동평균)
  smoothing: 0.3

tts:
  # TTS 엔진: sherpa-onnx + Supertonic v3.
  #   MeloTTS/Kokoro 는 폐기했다(Kokoro=한국어 음성 없음, MeloTTS=팀 폐기).
  #   mimic3-kss-low 는 프론트엔드 G2P가 espeak-ng 라 한국어 발음이 뭉개져 음질이 나빴다.
  #   Supertonic v3(한국 Supertone사)는 한국어 네이티브·다화자·44.1kHz·int8 로
  #   Jetson 에서 오프라인 동작하며 음질이 확연히 낫다. 결정 경위: docs/conversation_log.md
  engine: "supertonic"
  language: "ko"

  # 모델 경로 (repo 루트 기준 상대경로). 실제 파일은 .gitignore(models/)로 커밋 제외.
  model_dir: "models/supertonic-3-int8"

  # 화자 (0~9). 청취 비교로 sid0 확정.
  sid: 0

  # 연산 장치. cuda = Jetson GPU(sherpa-onnx GPU 빌드 필요, 이미 .venv에 설치됨).
  #   GPU 초기화 실패 시 speaker.py 가 자동으로 cpu 로 폴백한다.
  provider: "cuda"

  # flow-matching 스텝 수. 클수록 품질↑·느림.
  #   실측(Orin Nano, 문장 2.7s):
  #     GPU  16→0.9s, 32→1.5s   (실시간)
  #     CPU  16→5.0s, 32→9.4s   (폴백 시. 느림)
  #   청취 비교로 32스텝 확정(사용자가 제일 깔끔하다고 고름). GPU라 실시간 가능.
  num_steps: 32
  speed: 1.0
  num_threads: 4          # cpu 폴백 시 사용. Orin Nano 6코어지만 int8은 4가 가장 빠름(6은 경합)

  # 재생 장치. null = 시스템 기본. I2S 스피커(MAX98357A) 연결 후
  #   sounddevice 의 장치 인덱스/이름을 여기에 적는다.
  output_device: null

  max_chars: 200

ui:
  # 자막은 멀리서도 읽혀야 한다.
  font_size: 36
  max_lines: 3

  # 1패스 임시 자막은 흐리게, 2패스 교정 자막은 선명하게.
  # 사용자가 "아직 확정 아님"을 눈으로 알 수 있게 한다.
  draft_opacity: 0.5

metrics:
  # 기능을 만들 때 측정 코드를 같이 만든다.
  # 나중에 붙이려면 구조를 뜯어야 한다.
  enabled: true
  output_dir: "../experiments/data"   # 커밋 금지 (.gitignore)

# ─────────────────────────────────────────────
# 핵심 세 기능(기능 1·2·6)을 먼저 만든 뒤, 기능 3(이름 호명)·기능 5(수업 기록)를 추가로 구현했다.
# 아래 relay(기능 4)와 events의 비음성 소리는 다음 단계다.
# ─────────────────────────────────────────────

events:
  # 기능 3 소리 이벤트 — 지금은 '이름 호명'만 음성 기반으로 구현(오디오 모델 없이 자막 텍스트에서 찾음).
  #   종소리·경보 등 비음성 소리는 다음 단계.
  enabled: true            # 이름 호명 알림 사용
  student_names: ["함도유", "도유"]   # 감지할 학생 이름(부분 일치). "함도유 학생"·"도유야" 모두 잡힘
  labels: ["이름 호명", "종소리", "질문", "경보"]
  threshold: 0.6           # 비음성 오디오 분류용(지금은 미사용)

relay:
  enabled: false           # 기능 4 블루투스 소리 전달 — 다음 단계
  agc: true
  safety_limiter_db: -6.0  # 출력 상한 (안전 — 반드시 유지)

summary:
  # 기능 5 수업 기록(전체 스크립트). 화면 '수업 기록 보기' 버튼 + 수업 종료(ESC) 시 파일 저장.
  #   모든 발화를 그대로 기록한다(가벼운 정리만: 공백·마침표 보정, 직전과 똑같은 줄만 제거).
  #   요약(추출)이 아니라 전체 기록 — 없는 말을 지어내지 않는다.
  enabled: true            # 버튼은 항상 동작. enabled 는 '종료 시 파일 저장' 여부.
  output_dir: "./notes"    # repo 루트 기준. 실제 수업 내용이라 커밋하지 않는다(.gitignore)
