    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Malgun Gothic'; text-anchor: middle" x="118.44" y="34.300327" transform="rotate(-0 118.44 34.300327)">USB 마이크에서 음성 수집</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(50.264609 101.950403)">Silero VAD로 발화 구간 분리</text>
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(60.264219 117.850403)">실제 시작 · 끝 시각 보존</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(57.322719 194.800504)">다국어 small 모델로 전사</text>
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(61.327531 210.534879)">영어 과목: ko / en 선택</text>
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(42.704656 226.600504)">그 외: ko 고정 · hotwords 적용</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(64.404844 308.616281)">자막 · 방향 · 이름 알림</text>
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(42.086875 324.516281)">실제 무음과 방향으로 문단 구분</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(41.962656 389.23069)">30초 자동 저장 · 기록 다시 보기</text>
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(54.550156 405.13069)">이메일 전송은 인터넷 필요</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(334.530156 31.416004)">마이크의 방향 각도 수집</text>
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(327.366875 47.295301)">발화 시각에 맞춰 표본 연결</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(346.993438 182.590483)">사용자가 질문 입력</text>
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(336.8075 198.490483)">남성 · 여성 목소리 선택</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(340.926594 262.513408)">Supertonic 음성 합성</text>
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(328.322531 279.130564)">STT와 GPU 사용 순서 조정</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(334.270125 348.91065)">Bluetooth 스피커로 재생</text>
    <text style="font-size: 10.6px; font-family: 'Malgun Gothic'" transform="translate(337.966875 364.81065)">완료 후 자막 처리 계속</text>
